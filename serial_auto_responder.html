<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>串口自动回复工具</title>
<style>
  /* ========== 主题变量 ========== */
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #e2e8f0; --text-muted: #94a3b8; --accent: #3b82f6;
    --accent-hover: #2563eb; --danger: #ef4444; --danger-hover: #dc2626;
    --success: #22c55e; --rx: #f59e0b; --tx: #3b82f6;
    --input-bg: #0f172a; --card-hover: #475569; --overlay-bg: rgba(0,0,0,0.6);
    --toast-bg: #1e293b; --empty-opacity: 0.3; --scrollbar-thumb: #334155;
  }
  [data-theme="light"] {
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0;
    --text: #1e293b; --text-muted: #64748b; --accent: #2563eb;
    --accent-hover: #1d4ed8; --danger: #dc2626; --danger-hover: #b91c1c;
    --success: #16a34a; --rx: #d97706; --tx: #2563eb;
    --input-bg: #f1f5f9; --card-hover: #e2e8f0; --overlay-bg: rgba(0,0,0,0.4);
    --toast-bg: #ffffff; --empty-opacity: 0.2; --scrollbar-thumb: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }
  .header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    transition: background 0.3s, border-color 0.3s;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin-right: auto; }
  .header .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--border); color: var(--text-muted);
  }
  .header .badge.ok { background: rgba(34,197,94,0.15); color: var(--success); }
  .header .badge.err { background: rgba(239,68,68,0.15); color: var(--danger); }
  .btn {
    padding: 6px 14px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: var(--accent); color: white; transition: all 0.15s; font-weight: 500;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--border); color: var(--text); }
  .btn.secondary:hover { background: var(--card-hover); }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: var(--danger-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-icon {
    padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px;
  }
  select, input {
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 13px; outline: none;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  input.error { border-color: var(--danger); }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 420px; min-width: 320px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }
  .section-title {
    padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    transition: border-color 0.3s;
  }
  .serial-config { padding: 16px; border-bottom: 1px solid var(--border); transition: border-color 0.3s; }
  .form-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .form-row label { font-size: 12px; color: var(--text-muted); min-width: 60px; }
  .form-row select, .form-row input { flex: 1; min-width: 80px; }
  .rules-container { flex: 1; overflow-y: auto; padding: 8px; }
  .rule-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 8px; position: relative; transition: all 0.15s;
  }
  .rule-card:hover { border-color: var(--card-hover); }
  .rule-card.disabled { opacity: 0.5; }
  .rule-card .rule-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .rule-card .rule-name { font-weight: 600; font-size: 13px; }
  .rule-card .rule-actions { display: flex; gap: 4px; }
  .rule-card .rule-actions button {
    padding: 2px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer;
    background: var(--border); color: var(--text); opacity: 0.7;
  }
  .rule-card .rule-actions button:hover { opacity: 1; }
  .rule-card .bytes {
    font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 12px; line-height: 1.6;
  }
  .rule-card .bytes .label { color: var(--text-muted); margin-right: 6px; }
  .rule-card .bytes .trigger { color: var(--rx); }
  .rule-card .bytes .response { color: var(--tx); }
  .editor-overlay {
    position: fixed; inset: 0; background: var(--overlay-bg); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  .editor-overlay.active { display: flex; }
  .editor-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 480px; max-width: 90vw; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: background 0.3s, border-color 0.3s;
  }
  .editor-panel h3 { margin-bottom: 16px; font-size: 16px; }
  .editor-panel .field { margin-bottom: 14px; }
  .editor-panel .field label {
    display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px;
  }
  .editor-panel .field input, .editor-panel .field textarea {
    width: 100%; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; font-family: monospace;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .editor-panel .field textarea { resize: vertical; min-height: 60px; }
  .editor-panel .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .editor-panel .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center;
    transition: border-color 0.3s;
  }
  .log-container {
    flex: 1; overflow-y: auto; padding: 12px 16px; font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 12px; line-height: 1.7;
  }
  .log-line { margin-bottom: 2px; display: flex; gap: 8px; }
  .log-line .time { color: var(--text-muted); flex-shrink: 0; }
  .log-line .tag {
    padding: 0 6px; border-radius: 3px; font-size: 10px; font-weight: 600; flex-shrink: 0;
    text-transform: uppercase; line-height: 18px; margin-top: 1px;
  }
  .log-line .tag.rx { background: rgba(245,158,11,0.15); color: var(--rx); }
  .log-line .tag.tx { background: rgba(59,130,246,0.15); color: var(--tx); }
  .log-line .tag.sys { background: var(--border); color: var(--text-muted); }
  .log-line .data { word-break: break-all; }
  .log-line .data .rule-name { color: var(--text-muted); margin-left: 8px; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-muted); gap: 12px;
  }
  .empty-state svg { width: 48px; height: 48px; opacity: var(--empty-opacity); }
  .import-export { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; transition: border-color 0.3s; }
  .import-export input[type="file"] { display: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  .toast {
    position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 8px;
    background: var(--toast-bg); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; z-index: 200; transform: translateY(100px); opacity: 0;
    transition: all 0.3s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .toast.success { border-color: var(--success); color: var(--success); }
</style>
</head>
<body>

<div class="header">
  <h1>🔌 串口自动回复工具</h1>
  <span id="apiStatus" class="badge">检测中...</span>
  <span id="connStatus" class="badge">未连接</span>
  <button class="btn btn-icon" id="btnTheme" onclick="toggleTheme()" title="切换主题">
    <svg id="iconTheme" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <span id="themeLabel">深色</span>
  </button>
  <button class="btn" id="btnSelectPort" onclick="selectPort()">选择串口</button>
  <button class="btn secondary" id="btnOpen" onclick="openPort()" disabled>打开</button>
  <button class="btn danger" id="btnClose" onclick="closePort()" disabled>关闭</button>
</div>

<div class="main">
  <div class="sidebar">
    <div class="serial-config">
      <div class="form-row">
        <label>波特率</label>
        <select id="baudRate">
          <option value="9600">9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200" selected>115200</option>
          <option value="230400">230400</option>
          <option value="460800">460800</option>
          <option value="921600">921600</option>
        </select>
        <label>数据位</label>
        <select id="dataBits"><option value="7">7</option><option value="8" selected>8</option></select>
      </div>
      <div class="form-row">
        <label>停止位</label>
        <select id="stopBits"><option value="1" selected>1</option><option value="2">2</option></select>
        <label>校验</label>
        <select id="parity"><option value="none" selected>None</option><option value="even">Even</option><option value="odd">Odd</option></select>
      </div>
    </div>

    <div class="section-title">
      <span>规则列表</span>
      <button class="btn" style="padding:4px 10px;font-size:12px;" onclick="openEditor()">+ 添加规则</button>
    </div>

    <div class="rules-container" id="rulesList">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>暂无规则，点击上方添加</span>
      </div>
    </div>

    <div class="import-export">
      <button class="btn secondary" onclick="exportConfig()">导出配置</button>
      <button class="btn secondary" onclick="document.getElementById('fileInput').click()">导入配置</button>
      <input type="file" id="fileInput" accept=".json" onchange="importConfig(this)">
    </div>
  </div>

  <div class="content">
    <div class="toolbar">
      <button class="btn secondary" onclick="clearLog()">清空日志</button>
      <button class="btn secondary" id="btnPause" onclick="togglePause()">暂停显示</button>
      <select id="displayMode" onchange="renderLog()" style="margin-left:auto;">
        <option value="hex">HEX 显示</option>
        <option value="ascii">ASCII 显示</option>
        <option value="both">HEX + ASCII</option>
      </select>
    </div>
    <div class="log-container" id="logContainer"></div>
  </div>
</div>

<!-- 规则编辑器 -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor-panel">
    <h3 id="editorTitle">添加规则</h3>
    <div class="field">
      <label>规则名称</label>
      <input type="text" id="editName" placeholder="例如：心跳回复">
    </div>
    <div class="field">
      <label>触发序列 (十六进制)</label>
      <textarea id="editTrigger" placeholder="01 02 03 或 0x01,0x02,0x03 或 010203"></textarea>
      <div class="hint">支持空格、逗号分隔，或 0x 前缀</div>
    </div>
    <div class="field">
      <label>回复序列 (十六进制)</label>
      <textarea id="editResponse" placeholder="04 05 06"></textarea>
      <div class="hint" id="editHint"></div>
    </div>
    <div class="field">
      <label>优先级 (数字越小越优先)</label>
      <input type="number" id="editPriority" value="1" min="0" max="999">
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="closeEditor()">取消</button>
      <button class="btn" onclick="saveRule()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 全局状态 ====================
let port = null;
let reader = null;
let writer = null;
let readLoopRunning = false;
let rules = [];
let logPaused = false;
let logEntries = [];
let editingId = null;
let receiveBuffer = new Uint8Array(0);
let nextId = 1;
let currentTheme = 'dark';

const ICON_SUN = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  checkApiSupport();
  loadRules();
  renderRules();
});

// ==================== 主题切换 ====================
function initTheme() {
  const saved = localStorage.getItem('serial_theme');
  if (saved === 'light' || saved === 'dark') {
    currentTheme = saved;
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    currentTheme = 'light';
  }
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  const icon = document.getElementById('iconTheme');
  const label = document.getElementById('themeLabel');
  if (currentTheme === 'light') {
    icon.innerHTML = ICON_MOON;
    label.textContent = '浅色';
  } else {
    icon.innerHTML = ICON_SUN;
    label.textContent = '深色';
  }
}

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('serial_theme', currentTheme);
  applyTheme();
}

function checkApiSupport() {
  const badge = document.getElementById('apiStatus');
  if ('serial' in navigator) {
    badge.textContent = 'Web Serial API 可用';
    badge.className = 'badge ok';
  } else {
    badge.textContent = '当前浏览器不支持 Web Serial API，请使用 Chrome/Edge';
    badge.className = 'badge err';
    document.getElementById('btnSelectPort').disabled = true;
  }
}

// ==================== 串口操作 ====================
async function selectPort() {
  try {
    port = await navigator.serial.requestPort();
    showToast('已选择串口', 'success');
    document.getElementById('btnOpen').disabled = false;
  } catch (e) {
    if (e.name !== 'AbortError') showToast('选择串口失败: ' + e.message, 'error');
  }
}

async function openPort() {
  if (!port) return;
  try {
    const baudRate = parseInt(document.getElementById('baudRate').value);
    const dataBits = parseInt(document.getElementById('dataBits').value);
    const stopBits = parseInt(document.getElementById('stopBits').value);
    const parity = document.getElementById('parity').value;

    await port.open({ baudRate, dataBits, stopBits, parity });
    document.getElementById('connStatus').textContent = '已连接';
    document.getElementById('connStatus').className = 'badge ok';
    document.getElementById('btnOpen').disabled = true;
    document.getElementById('btnClose').disabled = false;
    document.getElementById('btnSelectPort').disabled = true;

    log('sys', '串口已打开: ' + baudRate + 'bps');
    startReadLoop();
  } catch (e) {
    showToast('打开串口失败: ' + e.message, 'error');
  }
}

async function closePort() {
  readLoopRunning = false;
  if (reader) {
    try { await reader.cancel(); } catch(e) {}
    reader = null;
  }
  if (port) {
    try { await port.close(); } catch(e) {}
    port = null;
  }
  document.getElementById('connStatus').textContent = '未连接';
  document.getElementById('connStatus').className = 'badge';
  document.getElementById('btnOpen').disabled = false;
  document.getElementById('btnClose').disabled = true;
  document.getElementById('btnSelectPort').disabled = false;
  log('sys', '串口已关闭');
}

async function startReadLoop() {
  readLoopRunning = true;
  while (port && port.readable && readLoopRunning) {
    try {
      reader = port.readable.getReader();
      while (readLoopRunning) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value && value.length > 0) {
          onReceiveData(value);
        }
      }
    } catch (e) {
      if (readLoopRunning) log('sys', '读取错误: ' + e.message);
    } finally {
      if (reader) {
        try { reader.releaseLock(); } catch(e) {}
        reader = null;
      }
    }
  }
}

// ==================== 数据接收与匹配引擎 ====================
function onReceiveData(chunk) {
  const newBuf = new Uint8Array(receiveBuffer.length + chunk.length);
  newBuf.set(receiveBuffer);
  newBuf.set(chunk, receiveBuffer.length);
  receiveBuffer = newBuf;
  scanBuffer();
}

function scanBuffer() {
  const activeRules = rules
    .filter(r => r.enabled)
    .sort((a, b) => a.priority - b.priority);

  if (activeRules.length === 0) return;

  let maxTriggerLen = Math.max(...activeRules.map(r => r.trigger.length), 1);
  let changed = true;

  while (changed && receiveBuffer.length > 0) {
    changed = false;

    for (const rule of activeRules) {
      const idx = findSubarray(receiveBuffer, rule.trigger);
      if (idx !== -1) {
        sendData(rule.response);

        const matchedBytes = receiveBuffer.slice(idx, idx + rule.trigger.length);
        log('rx', bytesToHex(matchedBytes) + '  (匹配: ' + rule.name + ')', rule.name, matchedBytes);
        log('tx', bytesToHex(rule.response) + '  (规则: ' + rule.name + ')', rule.name, rule.response);

        receiveBuffer = receiveBuffer.slice(idx + rule.trigger.length);
        changed = true;
        break;
      }
    }
  }

  const keepLen = maxTriggerLen * 4;
  if (receiveBuffer.length > keepLen) {
    receiveBuffer = receiveBuffer.slice(-keepLen);
  }
}

function findSubarray(arr, sub) {
  if (sub.length === 0) return -1;
  if (arr.length < sub.length) return -1;
  for (let i = 0; i <= arr.length - sub.length; i++) {
    let match = true;
    for (let j = 0; j < sub.length; j++) {
      if (arr[i + j] !== sub[j]) { match = false; break; }
    }
    if (match) return i;
  }
  return -1;
}

async function sendData(data) {
  if (!port || !port.writable) return;
  try {
    const w = port.writable.getWriter();
    await w.write(data);
    w.releaseLock();
  } catch (e) {
    log('sys', '发送失败: ' + e.message);
  }
}

// ==================== 规则管理 ====================
function loadRules() {
  try {
    const raw = localStorage.getItem('serial_rules');
    if (raw) {
      const parsed = JSON.parse(raw);
      rules = parsed.map(r => ({
        ...r,
        trigger: parseHex(r.triggerHex),
        response: parseHex(r.responseHex)
      }));
      nextId = Math.max(...rules.map(r => r.id), 0) + 1;
    }
  } catch(e) { rules = []; }
}

function saveRules() {
  const serializable = rules.map(r => ({
    id: r.id, name: r.name, triggerHex: r.triggerHex, responseHex: r.responseHex,
    priority: r.priority, enabled: r.enabled
  }));
  localStorage.setItem('serial_rules', JSON.stringify(serializable));
}

function renderRules() {
  const container = document.getElementById('rulesList');
  if (rules.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span>暂无规则，点击上方添加</span>
      </div>`;
    return;
  }

  const sorted = [...rules].sort((a, b) => a.priority - b.priority);
  container.innerHTML = sorted.map((r, idx) => `
    <div class="rule-card ${r.enabled ? '' : 'disabled'}">
      <div class="rule-header">
        <span class="rule-name">${escapeHtml(r.name)} <span style="color:var(--text-muted);font-weight:400;">[#${r.priority}]</span></span>
        <div class="rule-actions">
          <button onclick="toggleRule(${r.id})">${r.enabled ? '禁用' : '启用'}</button>
          <button onclick="moveRule(${r.id}, -1)">↑</button>
          <button onclick="moveRule(${r.id}, 1)">↓</button>
          <button onclick="editRule(${r.id})">编辑</button>
          <button onclick="deleteRule(${r.id})" style="color:var(--danger)">删除</button>
        </div>
      </div>
      <div class="bytes">
        <span class="label">触发:</span><span class="trigger">${bytesToHex(r.trigger)}</span>
        <span style="margin:0 8px;color:var(--text-muted)">→</span>
        <span class="label">回复:</span><span class="response">${bytesToHex(r.response)}</span>
      </div>
    </div>
  `).join('');
}

function toggleRule(id) {
  const r = rules.find(x => x.id === id);
  if (r) { r.enabled = !r.enabled; saveRules(); renderRules(); }
}

function moveRule(id, dir) {
  const idx = rules.findIndex(x => x.id === id);
  if (idx === -1) return;
  const other = idx + dir;
  if (other < 0 || other >= rules.length) return;
  const temp = rules[idx].priority;
  rules[idx].priority = rules[other].priority;
  rules[other].priority = temp;
  saveRules();
  renderRules();
}

function deleteRule(id) {
  if (!confirm('确定删除这条规则吗？')) return;
  rules = rules.filter(x => x.id !== id);
  saveRules();
  renderRules();
}

// ==================== 编辑器 ====================
function openEditor() {
  editingId = null;
  document.getElementById('editorTitle').textContent = '添加规则';
  document.getElementById('editName').value = '';
  document.getElementById('editTrigger').value = '';
  document.getElementById('editResponse').value = '';
  document.getElementById('editPriority').value = 1;
  document.getElementById('editHint').textContent = '';
  document.getElementById('editorOverlay').classList.add('active');
}

function editRule(id) {
  const r = rules.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('editorTitle').textContent = '编辑规则';
  document.getElementById('editName').value = r.name;
  document.getElementById('editTrigger').value = r.triggerHex;
  document.getElementById('editResponse').value = r.responseHex;
  document.getElementById('editPriority').value = r.priority;
  document.getElementById('editHint').textContent = '';
  document.getElementById('editorOverlay').classList.add('active');
}

function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('active');
}

function saveRule() {
  const name = document.getElementById('editName').value.trim();
  const triggerHex = document.getElementById('editTrigger').value.trim();
  const responseHex = document.getElementById('editResponse').value.trim();
  const priority = parseInt(document.getElementById('editPriority').value) || 0;

  if (!name) { showToast('请输入规则名称', 'error'); return; }

  let trigger, response;
  try { trigger = parseHex(triggerHex); }
  catch(e) { showToast('触发序列格式错误: ' + e.message, 'error'); return; }
  try { response = parseHex(responseHex); }
  catch(e) { showToast('回复序列格式错误: ' + e.message, 'error'); return; }

  if (trigger.length === 0) { showToast('触发序列不能为空', 'error'); return; }

  if (editingId) {
    const r = rules.find(x => x.id === editingId);
    if (r) {
      r.name = name; r.triggerHex = triggerHex; r.responseHex = responseHex;
      r.trigger = trigger; r.response = response; r.priority = priority;
    }
  } else {
    rules.push({
      id: nextId++, name, triggerHex, responseHex, trigger, response,
      priority, enabled: true
    });
  }

  saveRules();
  renderRules();
  closeEditor();
  showToast('规则已保存', 'success');
}

// ==================== 导入导出 ====================
function exportConfig() {
  const data = {
    version: 1,
    rules: rules.map(r => ({
      id: r.id, name: r.name, triggerHex: r.triggerHex, responseHex: r.responseHex,
      priority: r.priority, enabled: r.enabled
    }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'serial-rules-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('配置已导出', 'success');
}

function importConfig(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.rules || !Array.isArray(data.rules)) throw new Error('格式错误');
      rules = data.rules.map(r => ({
        ...r,
        trigger: parseHex(r.triggerHex),
        response: parseHex(r.responseHex)
      }));
      nextId = Math.max(...rules.map(r => r.id), 0) + 1;
      saveRules();
      renderRules();
      showToast('配置已导入 (' + rules.length + ' 条规则)', 'success');
    } catch (err) {
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ==================== 日志系统 ====================
function log(tag, text, ruleName, rawBytes) {
  const now = new Date();
  const time = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + '.' + pad3(now.getMilliseconds());
  logEntries.push({ time, tag, text, ruleName, rawBytes });
  if (!logPaused) renderLog();
}

function renderLog() {
  const container = document.getElementById('logContainer');
  const mode = document.getElementById('displayMode').value;
  const html = logEntries.map(e => {
    let dataStr = e.text;
    if (e.rawBytes && mode === 'ascii') {
      dataStr = bytesToAscii(e.rawBytes);
    } else if (e.rawBytes && mode === 'both') {
      dataStr = bytesToHex(e.rawBytes) + '  |  ' + bytesToAscii(e.rawBytes);
    }
    const ruleLabel = e.ruleName ? `<span class="rule-name">[${escapeHtml(e.ruleName)}]</span>` : '';
    return `<div class="log-line"><span class="time">${e.time}</span><span class="tag ${e.tag}">${e.tag}</span><span class="data">${escapeHtml(dataStr)}${ruleLabel}</span></div>`;
  }).join('');
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function clearLog() {
  logEntries = [];
  document.getElementById('logContainer').innerHTML = '';
}

function togglePause() {
  logPaused = !logPaused;
  document.getElementById('btnPause').textContent = logPaused ? '继续显示' : '暂停显示';
  if (!logPaused) renderLog();
}

// ==================== 工具函数 ====================
function parseHex(str) {
  if (!str.trim()) return new Uint8Array(0);
  const cleaned = str
    .replace(/0x/gi, '')
    .replace(/[^0-9a-fA-F]/g, '');
  if (cleaned.length % 2 !== 0) throw new Error('十六进制字符数必须是偶数');
  const bytes = [];
  for (let i = 0; i < cleaned.length; i += 2) {
    bytes.push(parseInt(cleaned.substr(i, 2), 16));
  }
  return new Uint8Array(bytes);
}

function bytesToHex(arr) {
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
}

function bytesToAscii(arr) {
  return Array.from(arr).map(b => {
    if (b >= 32 && b <= 126) return String.fromCharCode(b);
    return '.';
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function pad2(n) { return n.toString().padStart(2, '0'); }
function pad3(n) { return n.toString().padStart(3, '0'); }

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
